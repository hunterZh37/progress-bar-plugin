id = "hunter.connectors"
name = "Connectors"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Side pane showing Claude Code connectors (MCP servers) and their status"
platforms = ["macos", "linux"]

[[actions]]
id = "toggle"
title = "Toggle connectors pane"
contexts = ["workspace"]
command = ["bash", "bin/toggle.sh"]

[[panes]]
id = "panel"
title = "Connectors"
placement = "split"
command = ["bash", "bin/pane.sh"]
